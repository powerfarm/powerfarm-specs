name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  specifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install pinned validation tooling
        run: python -m pip install --no-deps -r tools/requirements.txt
      - name: Validate schemas, examples, conformance catalog and links
        run: python tools/validate.py
