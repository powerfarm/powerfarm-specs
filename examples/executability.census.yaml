apiVersion: powerfarm.specs/v0
kind: ExecutabilityContract
metadata:
  id: pf.contract.exec.coloured-places.census
  generation: 1
  subject: pf.coloured-places
  owner: pf.office.continuity
  issuedAt: "2026-09-16T05:30:00Z"
  summary: Periodically census recognized applications and record observational evidence.
spec:
  guards:
