      ref:
        provider: pf.antenna
        contract:
          id: pf.contract.antenna.coloured-places.observability
          generation: 1
        predicate: census.observation-recorded
        expected: true
        maxAge: PT2M
    timeout: PT45S
    onTimeout: uncertain
  retry:
    maxAttempts: 3
    strategy: effect-certainty
    backoff:
      initial: PT2S
      maximum: PT30S
      multiplier: 2
