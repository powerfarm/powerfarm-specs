version: powerfarm.conformance/v0
purpose: Behavioral cases that implementations should turn into executable tests. Technology choices are intentionally absent.
cases:
  - id: APP-001
    area: app-contract
    title: Reject filesystem traversal in a declared store locator
    given: An App Contract contains stateStores[].locator.relativePath with ../.
    expect: Schema validation fails and no materialization begins.

  - id: APP-002
    area: app-contract
    title: Physical placement alone does not admit an application
    given: Application bytes exist under an App Park but no recognized App Contract generation and admission evidence exist.
    expect: The application is not institutionally admitted.

  - id: APP-003
    area: app-contract
    title: Missing required admission evidence prevents recognition
    given: Materialization completes only a subset of spec.admission requirements.
    expect: The candidate may remain staged or partial but MUST NOT become a recognized active App Contract generation.

  - id: APP-004
    area: app-contract
    title: Re-admitting the same immutable generation is idempotent
    given: The same contract id, generation, and contract digest are submitted twice.
    expect: The second operation returns the existing recognition or equivalent idempotent success without creating a competing generation.

  - id: APP-005
    area: app-contract
    title: Conflicting bytes under one generation are rejected
    given: An existing contract id and generation is recognized with digest A and a candidate arrives with digest B.
    expect: Recognition is rejected; a changed contract requires a new generation.

  - id: APP-006
    area: app-contract
    title: Existing store is never silently recreated
    given: Admission finds a declared store at the expected locator with a schema identity different from the contract.
    expect: Materialization stops for migration or operator decision and preserves the existing bytes.

  - id: APP-007
    area: app-contract
    title: Live database file digest is not persistent store identity
    given: A conforming local database changes rows while its store contract and schema generation remain unchanged.
    expect: The store remains the same institutional store; only explicit immutable snapshots receive content digests.

  - id: APP-008
    area: search
    title: Search discovers stores from recognized contracts
    given: A store is searchable in local files but absent from recognized App Contracts.
    expect: Powerfarm Search does not treat it as a recognized authoritative source merely because it is reachable.

  - id: REG-001
    area: registry
    title: Content existence does not imply recognition
    given: A valid CAS object exists with a known digest but no Registry artifact version or contract refers to it.
    expect: The object has material identity but no institutional meaning solely from existence.

  - id: REG-002
    area: registry
    title: Digest mismatch rejects content resolution
    given: A ContentRef expects digest A but the fetched bytes hash to B.
    expect: Resolution fails and the bytes are not returned as object A.

  - id: REG-003
    area: registry
    title: Supersession preserves prior contract generation
    given: Contract generation 2 supersedes generation 1.
    expect: Generation 1 remains historically addressable and generation 2 is the current recognized generation.

  - id: REG-004
    area: registry
    title: Grant revocation preserves history
    given: A current grant is revoked.
    expect: The grant remains addressable with revocation time and reason; it is not deleted to represent revocation.

  - id: REG-005
    area: registry
    title: Search index cannot grant authority
    given: A Search projection contains a stale record not present in current Registry recognition.
    expect: Search may return the stale projection with provenance but MUST NOT elevate it to current institutional authority.

  - id: EXEC-001
    area: executability
    title: Unknown evidence is not true
    given: T evaluates true and O evaluates unknown.
    expect: Ready is not satisfied and no trigger is produced.

  - id: EXEC-002
    area: executability
    title: Scope mismatch cannot create readiness
    given: Temporal evidence belongs to activation scope A and observational evidence belongs to unrelated scope B.
    expect: The evidence cannot be combined into one Ready assertion.

  - id: EXEC-003
    area: executability
    title: Observation before temporal evidence may be retained
    given: O becomes true first and policy observationBeforeTemporal is retain; T later becomes true within validity limits.
    expect: Readiness may become true using the retained observation if it remains valid.

  - id: EXEC-004
    area: executability
    title: Observation before temporal evidence may be discarded
    given: O becomes true first and policy observationBeforeTemporal is discard; T later becomes true.
    expect: The old observation does not satisfy O for that activation; new admissible observational evidence is required.

  - id: EXEC-005
    area: executability
    title: Temporal evidence before observation may be retained
    given: T becomes true first and policy temporalBeforeObservation is retain; O later becomes true within the temporal window.
    expect: Readiness may become true for the same activation.

  - id: EXEC-006
    area: executability
    title: Exclusive claim has one winner
    given: Two workers observe the same Trigger for the same contract id, generation, and activation id.
    expect: At most one valid exclusive claim is acquired.

  - id: EXEC-007
    area: executability
    title: Crash after claim but before dispatch is recoverable
    given: A worker acquires a claim and crashes before the first effect dispatch.
    expect: Recovery can safely resume or reacquire according to claim policy without fabricating a completed effect.

  - id: EXEC-008
    area: executability
    title: Reconcilable effect is verified before retry after uncertainty
    given: Dispatch may have reached the target, the worker crashes before outcome certainty, and the effect class is reconcilable.
    expect: State becomes uncertain and verification/reconciliation occurs before any repeat dispatch.

  - id: EXEC-009
    area: executability
    title: Idempotent retry preserves logical idempotency key
    given: An idempotent effect is retried for the same activation after a transient failure.
    expect: Retries use the same logical idempotency key and a new attempt identity.

  - id: EXEC-010
    area: executability
    title: Irreversible uncertain effect is not blindly replayed
    given: Dispatch of an irreversible effect has unknown outcome.
    expect: Automatic repeat dispatch is forbidden; the state remains uncertain pending explicit reconciliation or policy.

  - id: EXEC-011
    area: executability
    title: Transport success does not imply verified effect
    given: Dispatch returns HTTP 200 and post-effect verification evaluates false.
    expect: The activation is not marked verified or done solely because of the HTTP response.

  - id: EXEC-012
    area: executability
    title: Expiration before claim prevents materialization
    given: Readiness occurred but the expiration guard became true before a valid claim was acquired.
    expect: No new effect materialization begins for that expired activation.

  - id: EXEC-013
    area: executability
    title: Cancellation does not erase already-dispatched history
    given: An activation is cancelled after a dispatch has occurred.
    expect: Cancellation stops future permitted work while preserving dispatch and certainty history for reconciliation.

  - id: EXEC-014
    area: executability
    title: Supersession does not rewrite an in-flight generation
    given: Generation 2 is recognized while an activation of generation 1 is already claimed.
    expect: The in-flight activation retains generation 1 semantics unless an explicit cancellation/supersession policy says otherwise.

  - id: EXEC-015
    area: executability
    title: Recurring temporal occurrences have distinct activation identities
    given: A recurrence becomes due on two separate occurrences.
    expect: Each intended occurrence has a distinct activation id while retries of one occurrence retain its activation id.

  - id: EXEC-016
    area: executability
    title: Level trigger does not busy-loop by itself
    given: T and O remain continuously true under level-triggered semantics.
    expect: Retrigger behavior is controlled by policy/history; mere repeated evaluation MUST NOT create unbounded duplicate activations.

  - id: OBS-001
    area: observability
    title: Heartbeat and census retain separate provenance
    given: A fresh spontaneous heartbeat exists but the most recent scheduled census failed.
    expect: A projection may show the discrepancy; it does not collapse both observations into one opaque health fact.

  - id: OBS-002
    area: observability
    title: Unrecognized speaker remains unrecognized
    given: Antenna receives valid signals from an entity absent from current Registry recognition.
    expect: The arrival is preserved as observational evidence but does not create institutional identity or authority.

  - id: HEART-001
    area: heartime
    title: Planning review precedes coverage expiry
    given: A responsibility enters period N with valid coverage.
    expect: A review is durable before expiry and a successful renewal atomically arms period N+1.
  - id: HEART-002
    area: heartime
    title: Failed planning has explicit fallback
    given: Coverage expires without a valid renewal.
    expect: Ordinary work is suppressed, contractual fallback is emitted, and another review remains due.
  - id: HEART-003
    area: heartime
    title: Kill after occurrence commit
    given: SIGKILL occurs after occurrence/evidence/outbox/next deadline commit and before publication.
    expect: Restart exposes the same occurrence and pending delivery with no duplicate semantic identity.
  - id: HEART-004
    area: heartime
    title: Contractual catch-up
    given: Several nominal instants pass during downtime under all, latest, and skip contracts.
    expect: All retains bounded batches without losing backlog, latest records coalesced coverage, and skip records omissions.
  - id: HEART-005
    area: heartime
    title: Contractual overlap
    given: Prior published work remains unresolved when another occurrence is due.
    expect: Allow, defer and coalesce control publication as declared without treating silence as completion.
  - id: HEART-006
    area: heartime
    title: Acknowledgement is not verification
    given: Delivery returns success and the process restarts before execution evidence arrives.
    expect: Status reports possibly executed and unresolved; a return deadline remains and no effect success is invented.
  - id: HEART-007
    area: heartime
    title: Pause and supersession preserve coverage
    given: An obligation is paused or replaced while a published occurrence is unresolved.
    expect: Its resume/review remains durable and historical occurrences retain their original terms.
  - id: HEART-008
    area: heartime
    title: Restart account answers from durable state
    given: The evaluating process is killed after an occurrence was committed, and again after a delivery attempt was recorded but before any acknowledgement.
    expect: After restart the ledger alone states what was due, what was emitted, what may have executed, what is unresolved, what is next with overdue marking, and that no active obligation lacks a future evaluation.
  - id: HEART-009
    area: heartime
    title: Obligations stay bounded and end explicitly
    given: A receiver is unreachable for many review intervals, a reviewed occurrence is resolved late, planning coverage ends, and another obligation expires or is retired.
    expect: One undelivered review per parent absorbs later deadlines, moot reviews and undeliverable work lapse with recorded reasons, and every return still owed by delivered work keeps its review.
  - id: ATTN-003
    area: attention
    title: A cognitive turn is reconstructable
    given: A WakePack is compiled with mandatory material, Cards and optional items under a byte budget, and one referenced object is later altered.
    expect: Every presented item is recoverable byte-for-byte from the compiled context, every omission carries its reason, the budget accounting matches the context, the invocation receipt identifies what ran without credentials, and the altered object is rejected.
  - id: CENSUS-002
    area: census
    title: A routed observation is not a recorded observation
    given: Antenna returns a receipt for census observations while the service run is still in progress or preserved different bytes.
    expect: Verification succeeds only after independent retrieval shows a completed run preserving the exact recorded payload digest; otherwise reconciliation does not run and the activation is contained or uncertain.
  - id: ATTN-001
    area: attention
    title: Mandatory context does not compete for salience
    given: The context budget cannot fit authority and restrictions.
    expect: Compilation fails rather than omitting mandatory terms.
  - id: ATTN-002
    area: attention
    title: Card expiry does not retire responsibility
    given: A discrepancy Card expires before its underlying failure is resolved.
    expect: Evidence, failure history and next temporal evaluation remain addressable.
  - id: TURN-001
    area: continuity
    title: Independent intelligence succession
    given: Occupant A changes durable institutional artifacts, then a fresh occupant B receives only a new WakePack and referenced state.
    expect: B continues and produces independently verified work without A conversation or narrative handoff.
  - id: TURN-002
    area: recovery
    title: Technical recovery does not require human engineering
    given: The primary executor fails under a bounded recovery contract.
    expect: Diagnosis, authorized fallback or containment is recorded with finite limits and future evaluation.
  - id: TURN-003
    area: recovery
    title: Genuine Direction boundary
    given: No authorized technical route can resolve a material Direction or legitimacy choice.
    expect: A record identifies what happened, consequence, attempted recovery and exact decision without asking for terminal debugging.
  - id: CENSUS-001
    area: census
    title: Cohort and mismatch classes are reconstructable
    given: Recognized population changes during a sweep with known, misplaced, absent, unknown, unrecognized and explicitly prohibited observations.
    expect: The frozen cohort governs that sweep; classes remain distinct and no repair authority follows from detection.
